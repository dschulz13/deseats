reference:
- title: Package overview
  desc: >
    This entry gives you an overview of the package.
  contents:
  - deseats-package

- title: Decomposition functions

- subtitle: Automated methods
  desc: > 
   These function allow for mostly automated decomposition of seasonal
   time series.
  contents:
  - deseats
  - s_semiarma
  - BV4.1
  - BV4.1_base
  - hamilton_filter  
  
- subtitle: Non-automated methods
  desc: >
   These functions for decomposition of seasonal time series require manual 
   adjustments of the input arguments.
  contents:
  - ma_decomp
  - lm_decomp
  - llin_decomp

- title: Helper function for time series

- subtitle: ARMA representations
  desc: >
   These functions allow for obtaining the coefficients of the infinite-order 
   AR and MA representations of ARMA models
  contents:
  - arma_to_ar
  - arma_to_ma
  - select_bwidth
  
- subtitle: Handling of time series
  desc: >
   These function allow the user to facilitate to work with time series objects.
  contents:
  - zoo_to_ts
  - read_ts

- subtitle: Further functions
  desc: >
    These are further interesting functions for time series.
  contents:
  - create.gain
  - hA_calc
  
- title: Forecasting functions and methods
  desc: >
    These functions allow the user to create and handle forecasts.
  contents:
  - expo,deseats_fc-method
  - measures
  - predict,s_semiarma-method
  
- title: Included time series data
  desc: >
    These entries are on real-world time series data included in the package.
  contents:
